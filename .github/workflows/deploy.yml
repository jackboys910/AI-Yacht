name: Deploy to Cloudflare

# Three ways in, one build:
#
#   - by hand, from the Actions tab, choosing the branch and the target;
#   - from the admin panel, which asks the Cloudflare Worker to start this
#     workflow when the owner publishes something (А-08, А-09);
#   - once a day, so a trip whose end date has passed moves from "Upcoming"
#     to "Past" on its own (§6.2) without anyone pressing anything.
#
# The scheduled run has no inputs, so every use of `inputs.environment` falls
# back to production.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Where to deploy"
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
  schedule:
    # 01:00 UTC — an hour after the date rolls over, since the site decides
    # what is past by the UTC date.
    - cron: "0 1 * * *"

concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy (${{ inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out ${{ github.ref_name }}
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build
        env:
          # Optional overrides. If a repository variable is not set, the
          # defaults in src/lib/site.ts are used instead.
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ vars.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ vars.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}

      - name: Verify build output
        run: |
          test -f out/index.html || { echo "::error::out/index.html is missing"; exit 1; }
          echo "Built $(find out -type f | wc -l) files."

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # A preview run deploys to a named version that does NOT take over
          # the live domain, so you can check it before promoting.
          command: >-
            ${{ (inputs.environment || 'production') == 'production'
                && 'deploy'
                || 'versions upload' }}

      - name: Summary
        run: |
          echo "### Deployed :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Target: \`${{ inputs.environment || 'production' }}\`" >> $GITHUB_STEP_SUMMARY
